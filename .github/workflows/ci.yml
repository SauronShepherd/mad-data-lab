name: mad-data-lab-ci
on:
  push:
    branches: [main, 'MDL-*', 'codex/**']
  pull_request:
jobs:
  local-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: uv lock --check
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/generate_cases.py
      - run: python scripts/branch_guard.py
      - run: python scripts/classify_change.py
      - name: Run pytest with collection diagnostics
        shell: bash
        run: |
          set +e
          python scripts/pytest_gate.py --maxfail=1 > pytest-report.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            detail=$(tail -c 8000 pytest-report.txt | tr '\n' ' ' | tr '\r' ' ')
            echo "::error title=Python test suite::$detail"
          fi
          cat pytest-report.txt
          exit "$status"
      - run: python scripts/security_gate.py
      - run: python scripts/frontend_contract_gate.py
      - run: python scripts/openapi_contract_gate.py
      - run: python scripts/validate_mdl1_traceability.py
      - run: python scripts/production_architecture_gate.py
      - run: python scripts/run_iteration_gate.py
      - run: python scripts/validate_mdl2_contract.py
      - run: python scripts/validate_mdl3_contract.py --strict
      - run: python scripts/run_mdl3_benchmark.py
      - name: Upload local contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-contract-evidence-${{ github.sha }}
          path: |
            pytest-report.txt
            release-report/**
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      # Playwright's webServer launches the FastAPI app; install its runtime
      # dependencies before starting the browser contract.
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run browser contract with diagnostics
        shell: bash
        run: |
          set +e
          npm run test:browser -- --reporter=json > browser-report.json 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            detail=$(tail -c 5000 browser-report.json | tr '\n' ' ' | tr '\r' ' ')
            echo "::error title=Playwright browser contract::$detail"
          fi
          exit "$status"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-evidence-${{ github.sha }}
          path: |
            browser-report.json
            test-results/**
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: docker compose build --pull=false
      - run: docker compose up -d
      - run: python scripts/container_smoke.py
      - run: python scripts/container_shutdown_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
