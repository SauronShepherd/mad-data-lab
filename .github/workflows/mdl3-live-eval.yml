name: mad-data-lab-mdl3-live-eval

on:
  push:
    branches: [MDL-3]
  workflow_dispatch:
    inputs:
      genie_space_id:
        description: Published Genie Space ID for the accepted MDL-03 configuration
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mdl3-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-live-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - uses: databricks/setup-cli@main

      - name: Prove exact checked-out identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python scripts/validate_mdl3_contract.py --strict

      - name: Validate staging live-evaluation configuration
        env:
          # Verified staging workspace for the accepted sda-aap deployment. The
          # host is non-secret and may still be overridden by environment config.
          DATABRICKS_HOST: https://dbc-916267ef-3b9b.cloud.databricks.com
          DATABRICKS_CLIENT_ID: fe7c91e9-b565-466f-9e0a-a7dd79926135
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GENIE_SPACE_ID: 01f1a11f6c281e79bd1e0c448055fbdd
        run: |
          set -euo pipefail
          test -n "$DATABRICKS_HOST" || { echo 'Missing staging secret/variable: DATABRICKS_HOST' >&2; exit 1; }
          if [ -z "$DATABRICKS_CLIENT_ID" ] && [ -z "$DATABRICKS_TOKEN" ]; then
            echo 'Missing staging authentication: configure DATABRICKS_CLIENT_ID for OIDC or DATABRICKS_TOKEN for PAT auth' >&2
            exit 1
          fi
          test -n "$GENIE_SPACE_ID" || { echo 'Missing staging variable/secret or dispatch input: GENIE_SPACE_ID' >&2; exit 1; }
          case "$DATABRICKS_HOST" in
            https://*) ;;
            *) echo 'DATABRICKS_HOST must be an https:// Databricks workspace URL' >&2; exit 1 ;;
          esac
          echo "Configured Databricks host: ${DATABRICKS_HOST%%/*}"
          echo "Configured Genie Space ID: ${GENIE_SPACE_ID}"

      - name: Run authenticated 30-attempt MDL-03 batch
        env:
          DATABRICKS_HOST: https://dbc-916267ef-3b9b.cloud.databricks.com
          DATABRICKS_CLIENT_ID: fe7c91e9-b565-466f-9e0a-a7dd79926135
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AUTH_TYPE: ${{ secrets.DATABRICKS_TOKEN != '' && 'pat' || 'github-oidc' }}
          GENIE_SPACE_ID: 01f1a11f6c281e79bd1e0c448055fbdd
          # Keep the whole 30-case batch within the job timeout when a remote
          # Genie request is unavailable; the benchmark records that attempt
          # as a bounded failure instead of hanging the workflow.
          MDL3_BENCHMARK_ATTEMPT_TIMEOUT_SECONDS: '30'
          MDL3_BENCHMARK_DELAY_SECONDS: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 1500s \
            python scripts/run_mdl3_benchmark.py --no-fixture 2>&1 | \
            tee release-report/MDL-3/live-benchmark.log

      - name: Validate identity-bound live evidence
        env:
          ARTIFACT: release-report/MDL-3/live-benchmark.json
        run: |
          implementation_sha="$(git rev-parse HEAD)"
          contract_digest="$(python -c 'from backend.genie.config_digest import genie_contract_digest; print(genie_contract_digest())')"
          live_config_sha="$(python -c 'import json; print(json.load(open("release-report/MDL-3/genie-live-config.json"))["genie_live_config_sha256"])')"
          data_digest="$(python scripts/compute_mdl2_data_digest.py)"
          case_hash="$(python -c 'from data.generation.case_0042 import generate_case; print(generate_case().content_hash)')"
          python scripts/validate_mdl3_evidence.py "$ARTIFACT" \
            --implementation-sha "$implementation_sha" \
            --genie-contract-digest "$contract_digest" \
            --genie-live-config-sha256 "$live_config_sha" \
            --mdl2-data-contract-digest "$data_digest" \
            --case-hash "$case_hash"

      - name: Upload immutable live-evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdl3-live-evidence-${{ github.sha }}
          if-no-files-found: error
          path: |
            release-report/MDL-3/live-benchmark.json
            release-report/MDL-3/live-benchmark.junit.xml
            release-report/MDL-3/live-benchmark.log
            release-report/MDL-3/contract-validation.json
