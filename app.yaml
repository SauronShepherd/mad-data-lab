command: ["python", "python/source_code/server/run.py"]
env:
  - name: GENIE_SPACE_ID
    valueFrom: genie-space
  - name: ALLOW_FIXTURE_MODE
    value: "0"
  - name: CHALLENGE_REVIEW_MODE
    value: "0"
  - name: GENIE_REQUEST_TIMEOUT_SECONDS
    value: "75"
  - name: GENIE_POLL_INTERVAL_MS
    value: "1000"
