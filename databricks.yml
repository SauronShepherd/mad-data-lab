bundle:
  name: mad-data-lab-mdl2

include:
  - resources/*.yml

sync:
  exclude:
    - .venv/**
    - .mdl3-venv/**
    - node_modules/**
    - tmp/**
    - tmp_remote_bundle_*/**
    - release-report/**
    - test-results/**
    - dist/**
    - assets/review/**

targets:
  staging:
    mode: development
    workspace:
      profile: mdl
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
