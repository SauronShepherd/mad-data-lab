[project]
name = "mad-data-lab"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "databricks-sdk>=0.60,<1",
  "databricks-sql-connector>=3.0,<4",
  "pydantic>=2.0,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2"]

[tool.ruff]
line-length = 120
